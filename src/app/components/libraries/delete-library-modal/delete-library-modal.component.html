<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Eliminar biblioteca</h3>
      <button class="close-button" (click)="onClose()" type="button">
        <lucide-icon [img]="icons.X" [size]="20" />
      </button>
    </div>

    <div class="modal-body">
      @if (errorMessage()) {
        <div class="alert alert-error">
          {{ errorMessage() }}
        </div>
      }

      <div class="warning-icon">
        <lucide-icon [img]="icons.AlertTriangle" [size]="48" />
      </div>

      <p class="confirmation-text">
        ¿Estás seguro de que deseas eliminar la biblioteca <strong>{{ library().name }}</strong>?
      </p>
    </div>

    <div class="modal-actions">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="onClose()"
        [disabled]="isDeleting()"
      >
        Cancelar
      </button>
      <button
        type="button"
        class="btn btn-danger"
        (click)="onDelete()"
        [disabled]="isDeleting()"
      >
        @if (isDeleting()) {
          Eliminando...
        } @else {
          Borrar
        }
      </button>
    </div>
  </div>
</div>

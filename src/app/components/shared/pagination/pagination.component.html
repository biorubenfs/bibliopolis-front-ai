<div class="pagination">
  <div class="pagination-controls">
    <div class="items-per-page">
      <label for="pageSize">Mostrar:</label>
      <select 
        id="pageSize"
        (change)="onItemsPerPageChange($event)"
      >
        @for (size of pageSizeOptions; track size) {
          <option [value]="size" [selected]="size === itemsPerPage()">{{ size }}</option>
        }
      </select>
    </div>

    <div class="pagination-info">
      <span>
        {{ (currentPage() - 1) * itemsPerPage() + 1 }}-{{ Math.min(currentPage() * itemsPerPage(), totalItems()) }} de {{ totalItems() }}
      </span>
    </div>

    <div class="pagination-buttons">
      <button 
        class="btn-pagination"
        [disabled]="currentPage() === 1"
        (click)="onPreviousPage()"
        type="button"
        title="Página anterior"
      >
        <lucide-icon [img]="icons.ChevronLeft" [size]="14" />
      </button>

      <button 
        class="btn-pagination"
        [disabled]="currentPage() === totalPages()"
        (click)="onNextPage()"
        type="button"
        title="Página siguiente"
      >
        <lucide-icon [img]="icons.ChevronRight" [size]="14" />
      </button>
    </div>
  </div>
</div>
